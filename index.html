<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070b13">
<title>我的系统</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我的系统">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 首次初始化 ============ -->
<div id="ob" class="ob hidden">
  <div class="ob-inner" id="ob-inner"></div>
</div>

<!-- ============ 应用主体 ============ -->
<div id="app" class="app hidden">
  <main class="pages">

    <!-- ===== 系统页 ===== -->
    <section class="page active" id="page-system">
      <header class="page-head">
        <div>
          <h1 class="brand">我的系统<i class="brand-dot"></i></h1>
          <p class="brand-sub" id="sys-line">SYSTEM ONLINE</p>
        </div>
        <button class="icon-btn" id="btn-sys-settings" title="系统设置">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="wz-note" id="sys-notice" style="display:none"></div>

      <div class="core-stage" id="core-stage"></div>

      <div class="sys-meta">
        <div class="sys-name-row">
          <span class="sys-name" id="sys-name">星枢</span>
          <span class="sys-level" id="sys-level">LV.1</span>
        </div>
        <p class="sys-status" id="sys-status"></p>
        <div class="growth-bar"><i id="growth-fill"></i></div>
        <p class="growth-text" id="growth-text">成长值 0 / 100</p>
      </div>

      <div class="stats-row">
        <div class="stat"><b id="stat-points">0</b><span>积分</span></div>
        <div class="stat"><b id="stat-tasks">0</b><span>进行中</span></div>
        <div class="stat"><b id="stat-done">0</b><span>已完成</span></div>
      </div>

      <div class="card current-task" id="current-task"></div>

      <div class="card wish-card">
        <h2 class="card-title">说出你的愿望</h2>
        <div class="wish-row">
          <input id="wish-input" placeholder="例如：我想变瘦 / 想早睡 / 想学好英语" maxlength="40">
          <button class="mic-btn hidden" id="mic-wish" title="语音输入" aria-label="语音输入">
            <svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          </button>
          <button class="primary-btn" id="btn-wish">生成计划</button>
        </div>
        <p class="wish-tip">想同时改变几件事？一次全说出来——系统会自动帮你拆成几个目标。<br>还没想好也可以直接点「探索模式」。</p>
        <button class="ghost-btn wide" id="btn-explore">暂时没有目标 · 先探索记录</button>
      </div>

      <div class="spacer"></div>
    </section>

    <!-- ===== 任务页 ===== -->
    <section class="page" id="page-task">
      <header class="page-head">
        <h1>任务</h1>
        <button class="primary-btn small" id="btn-new-goal">＋ 新目标</button>
      </header>
      <div class="filter-row" id="filter-row">
        <button class="chip on" data-f="all">全部</button>
        <button class="chip" data-f="todo">进行中</button>
        <button class="chip" data-f="done">已完成</button>
      </div>
      <div id="task-list"></div>
      <div class="spacer"></div>
    </section>

    <!-- ===== 我的页 ===== -->
    <section class="page" id="page-mine">
      <header class="page-head">
        <h1>我的</h1>
        <button class="icon-btn" id="btn-notes" title="能力说明">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 10.5v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.2" r="1.3" fill="currentColor"/></svg>
        </button>
      </header>

      <div class="mine-hero card">
        <div class="mine-avatar" id="mine-avatar"></div>
        <div class="mine-info">
          <h2 id="mine-name">未命名</h2>
          <p class="mine-brief" id="mine-brief"></p>
          <p class="mine-check" id="mine-check">累计打卡 0 次</p>
          <button class="ghost-btn" id="btn-edit-avatar">编辑形象 · 捏脸</button>
        </div>
      </div>

      <div class="menu card">
        <button class="menu-item" id="btn-profile">
          <span>个人资料</span><em>称呼 · 身高 · 体重 · 简介</em>
        </button>
        <button class="menu-item" id="btn-sys-settings2">
          <span>系统设置</span><em>名称 · 性格 · 形象 · 积分兑换</em>
        </button>
        <button class="menu-item" id="btn-records">
          <span>执行记录</span><em>打卡与任务历史</em>
        </button>
        <button class="menu-item" id="btn-export">
          <span>导出数据</span><em>下载 JSON 备份</em>
        </button>
        <button class="menu-item danger" id="btn-reset">
          <span>清空本地数据</span><em>删除本浏览器中的全部记录</em>
        </button>
      </div>

      <p class="ver">我的系统 · 原型 V1.2 · 演示版（数据保存在本机，匿名摘要可同步至云端供管理员查看）</p>
      <div class="spacer"></div>
    </section>
  </main>

  <!-- ===== 底部导航 ===== -->
  <nav class="tabbar">
    <button class="tab on" data-page="system">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 4"/></svg>
      <span>系统</span>
    </button>
    <button class="tab" data-page="task">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 9.5h7M8.5 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>任务</span>
    </button>
    <button class="tab" data-page="mine">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 19.5c1.2-3.5 4-5 7-5s5.8 1.5 7 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- ============ 弹出面板层 ============ -->
<div class="mask hidden" id="mask"></div>

<div class="sheet hidden" id="sheet-wizard">
  <div class="sheet-head"><h2 id="wizard-title">愿望澄清</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="wizard-body"></div>
</div>

<div class="sheet hidden" id="sheet-task">
  <div class="sheet-head"><h2>任务详情</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="task-body"></div>
</div>

<div class="sheet hidden" id="sheet-avatar">
  <div class="sheet-head"><h2>我的形象 · 捏脸</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="avatar-body"></div>
</div>

<div class="sheet hidden" id="sheet-settings">
  <div class="sheet-head"><h2>系统设置</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="settings-body"></div>
</div>

<div class="sheet hidden" id="sheet-profile">
  <div class="sheet-head"><h2>个人资料</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="profile-body"></div>
</div>

<div class="sheet hidden" id="sheet-records">
  <div class="sheet-head"><h2>执行记录</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="records-body"></div>
</div>

<div class="sheet hidden" id="sheet-notes">
  <div class="sheet-head"><h2>能力说明</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="notes-body"></div>
</div>

<div class="sheet hidden" id="sheet-split">
  <div class="sheet-head"><h2>识别到多个愿望</h2><button class="x" data-close>×</button></div>
  <div class="sheet-body" id="split-body"></div>
</div>

<div id="toast" class="toast"></div>

<script src="appearance.js"></script>
<script src="app.js"></script>
</body>
</html>
